name: Catalogue et dix dernières versions
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogue-distribution
  cancel-in-progress: false
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/catalog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
