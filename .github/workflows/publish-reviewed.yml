name: Publier les versions officielles vérifiées
on:
  push:
    branches: [publication/officielle-097-126]
    paths: [publication/manifest.json]
permissions:
  contents: write
concurrency:
  group: publication-officielle-097-126
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier tous les fichiers avant publication
        run: python3 publication/publish.py --verify-only
      - name: Publier les fichiers officiels et actualiser le catalogue
        run: python3 publication/publish.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
